# Jekyll config used only for the Game Reviews section.
# The portfolio pages (index.html, project folders) are plain HTML and are served as-is.
title: "Gonzalo Liñán · Game Reviews"
permalink: /reviews/:title/
markdown: kramdown
exclude:
  - README.md
  - COMO-ESCRIBIR-UNA-RESENA.md
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: review
